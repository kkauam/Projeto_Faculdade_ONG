<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engajamento | ONG Transformar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topo">
        <div class="topo-interno">
            <a class="marca" href="index.html">
                <img class="marca-logo" src="imagem/logo.jpg" alt="Logo da ONG Transformar">
                <h1>ONG Transformar</h1>
            </a>
            <nav aria-label="Navegação principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos Sociais</a></li>
                    <li><a href="cadastro.html" aria-current="page">Engajamento</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="painel-intro">
            <h2>Junte-se a nós</h2>
            <p class="lead">Preencha o formulário abaixo para se tornar um voluntário ou doador. Sua participação fortalece cada projeto da Transformar.</p>
        </section>
            
            <form id="form-engajamento">
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome">

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf">

                <label for="telefone">Telefone (WhatsApp):</label>
                <input type="tel" id="telefone" name="telefone">
            </fieldset>

            <fieldset>
                <legend>Localização</legend>
                
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep">

                <label for="endereco">Endereço Completo:</label>
                <input type="text" id="endereco" name="endereco">
            </fieldset>

            <button class="btn" type="submit">Confirmar Cadastro</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 ONG Transformar.</p>
    </footer>

    <script src="js/ui.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
